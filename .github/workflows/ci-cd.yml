name: CI/CD Pipeline

# 与 Locus 共享同一套 CI/CD 约定：
#   push 默认分支(master) / PR -> master : 编译 + 测试
#   push 版本 tag（v0.2.0 或 0.2.0）    : 编译 + 测试 + 打包 + 发布 NuGet
# 其他分支不触发任何任务。
#
# 版本号唯一来源是 Directory.Build.props 的 <Version>；eng/New-ReleaseNotes.ps1
# 在编译前校验 tag 与版本一致且指向 HEAD，因此包版本与 tag 不会漂移。
on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
      - '*.*.*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    env:
      # 默认分支或版本 tag 的 push 才产出可发布包；PR 与手动运行只编译、测试。
      PACKAGE_BUILD: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release notes generation
        shell: pwsh
        run: ./eng/Test-ReleaseNotes.ps1

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          [xml]$properties = Get-Content -LiteralPath Directory.Build.props -Raw
          $version = [string]$properties.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Directory.Build.props does not define <Version>.' }
          if ($env:GITHUB_REF.StartsWith('refs/tags/')) { 'release=true' >> $env:GITHUB_OUTPUT } else { 'release=false' >> $env:GITHUB_OUTPUT }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Validate release tag and generate version update notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./eng/New-ReleaseNotes.ps1 -Tag $env:RELEASE_TAG

      - name: Setup .NET 11 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Verify .NET 10 runtime
        shell: pwsh
        run: |
          if (-not (dotnet --list-runtimes | Select-String 'Microsoft\.NETCore\.App 10\.')) {
            throw '.NET 10 runtime is required to run the net10.0 test targets.'
          }

      - name: Setup package-consumer runtimes (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore OceanBaseConnector.slnx

      # Only the Windows package-build leg needs every product asset; it also
      # produces the packages Verify-Packages consumes. Other legs compile the
      # runtime used by the DI gate. Unit test shards build their own assets.
      - name: Build all package assets
        if: env.PACKAGE_BUILD == 'true' && runner.os == 'Windows'
        run: dotnet build OceanBaseConnector.slnx -c Release --no-restore

      - name: Build CI targets
        if: ${{ !(env.PACKAGE_BUILD == 'true' && runner.os == 'Windows') }}
        run: dotnet build OceanBaseConnector.slnx -c Release --no-restore -p:TargetFramework=net10.0

      - name: Dependency injection tests (.NET 10)
        run: >-
          dotnet test tests/OceanBaseConnector.DependencyInjection.Tests/OceanBaseConnector.DependencyInjection.Tests.csproj
          -c Release --no-restore --no-build
          --logger "trx;LogFileName=di-tests.trx"
          --results-directory TestResults/logs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/logs/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

      # 复用上一步的 Release 输出打包（--no-build --no-restore），不再重新编译。
      - name: Pack main/master or tag
        if: env.PACKAGE_BUILD == 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseNotes = @()
          if ($env:GITHUB_REF.StartsWith('refs/tags/')) {
            $releaseNotes = @("-p:PackageReleaseNotes=https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG")
          }
          foreach ($project in @('OceanBaseConnector', 'OceanBaseConnector.DependencyInjection')) {
            dotnet pack "src/$project/$project.csproj" -c Release --no-build --no-restore -o TestResults/packages @releaseNotes
            if ($LASTEXITCODE -ne 0) { throw "Packing $project failed." }
          }

      - name: Verify actual package consumers (Windows)
        if: env.PACKAGE_BUILD == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./eng/Verify-Packages.ps1 -PackageDirectory TestResults/packages

      - name: Upload verified packages and release notes
        if: env.PACKAGE_BUILD == 'true' && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: TestResults/packages/
          if-no-files-found: error
          retention-days: 30

  # 单元测试分片跑在独立 runner/进程上。xunit 的 "Driver diagnostics" 集合设置了
  # DisableParallelization:独占期间(ConnectRetry ~147s + EndpointHealth ~120s 纯重试
  # 间隔等待)整个进程不能跑其它用例;TextCommandTests 又单类 6648 例、串行 ~221s。
  # 两者在同一进程只能首尾相接(实测 span 564s ≈ 321s + 221s),拆进程后互不阻塞,
  # 墙钟≈最长的那片。第四片取补集,新增测试类自动落入 rest,不会漏跑。
  # SecurityTests 需要证书/真实数据库,按约定不进 OceanBaseConnector.slnx。
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        shard: [text, retry, endpoint, rest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 11 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Verify .NET 10 runtime
        shell: pwsh
        run: |
          if (-not (dotnet --list-runtimes | Select-String 'Microsoft\.NETCore\.App 10\.')) {
            throw '.NET 10 runtime is required to run the net10.0 test targets.'
          }

      - name: Setup package-consumer runtimes (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore OceanBaseConnector.slnx

      - name: Build all package assets (Windows)
        if: runner.os == 'Windows'
        run: dotnet build OceanBaseConnector.slnx -c Release --no-restore

      - name: Build CI targets (Linux)
        if: runner.os != 'Windows'
        run: dotnet build OceanBaseConnector.slnx -c Release --no-restore -p:TargetFramework=net10.0

      - name: Build netstandard2.1 unit test asset (Linux)
        if: runner.os != 'Windows'
        run: dotnet build src/OceanBaseConnector/OceanBaseConnector.csproj -c Release --no-restore -f netstandard2.1

      - name: Unit tests (${{ matrix.shard }})
        shell: pwsh
        run: |
          $filters = @{
            text     = 'FullyQualifiedName~TextCommandTests'
            retry    = 'FullyQualifiedName~ConnectRetryTests'
            endpoint = 'FullyQualifiedName~EndpointHealthTests'
            rest     = 'FullyQualifiedName!~TextCommandTests&FullyQualifiedName!~ConnectRetryTests&FullyQualifiedName!~EndpointHealthTests'
          }
          dotnet test tests/OceanBaseConnector.UnitTests/OceanBaseConnector.UnitTests.csproj `
            -c Release --no-restore --no-build `
            --filter $filters['${{ matrix.shard }}'] `
            --logger "trx;LogFileName=unit-${{ matrix.shard }}.trx" `
            --results-directory TestResults/logs
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed for shard ${{ matrix.shard }}." }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-${{ matrix.os }}-${{ matrix.shard }}
          path: TestResults/logs/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  # ConsumerTests contains TCP/protocol compatibility acceptance, without TLS.
  # 每个代表性产物资产一个分片并行跑:用例显示名里的 target 参数决定归属,
  # net8.0/net9.0 与非参数化用例落在 shared 分片,四个分片恰好覆盖全部用例
  # (新增用例要么带资产名、要么进 shared,不会被静默跳过)。分片各自编译,
  # 与 build-and-test 并行,不再串行等待。测试类已按场景拆开,分片内也能并行。
  consumer-acceptance:
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: netstandard2.0
            filter: 'DisplayName~netstandard2.0'
          - shard: netstandard2.1
            filter: 'DisplayName~netstandard2.1'
          - shard: net10.0
            filter: 'DisplayName~net10.0'
          # 取反过滤:没有资产名的用例(含 net8.0/net9.0 目标)全部归到此分片。
          - shard: shared
            filter: 'DisplayName!~netstandard2.0&DisplayName!~netstandard2.1&DisplayName!~net10.0'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 11 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Verify .NET 10 runtime
        shell: pwsh
        run: |
          if (-not (dotnet --list-runtimes | Select-String 'Microsoft\.NETCore\.App 10\.')) {
            throw '.NET 10 runtime is required to run the net10.0 test targets.'
          }

      - name: Setup package-consumer runtimes (Windows)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore OceanBaseConnector.slnx

      # 与 Windows 打包分支保持一致:消费者测试直接读取各 TFM 的 Release 产物。
      - name: Build all package assets
        run: dotnet build OceanBaseConnector.slnx -c Release --no-restore

      - name: Consumer acceptance tests (${{ matrix.shard }})
        run: >-
          dotnet test tests/OceanBaseConnector.ConsumerTests/OceanBaseConnector.ConsumerTests.csproj
          -c Release --no-restore --no-build
          --filter "${{ matrix.filter }}"
          --logger "trx;LogFileName=consumer-${{ matrix.shard }}.trx"
          --results-directory TestResults/logs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-test-results-${{ matrix.shard }}
          path: TestResults/logs/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  # 发布只消费构建产物：不 checkout 源码、不 restore、不编译。
  publish:
    needs: [build-and-test, unit-tests, consumer-acceptance]
    if: needs.build-and-test.outputs.release == 'true' && needs.unit-tests.result == 'success' && needs.consumer-acceptance.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required by NuGet trusted publishing (GitHub OIDC token)
    steps:
      - name: Setup .NET 11 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Download verified packages and release notes
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: TestResults/packages

      # Trusted publishing: exchange this workflow's GitHub OIDC token for a
      # one-hour nuget.org API key. Requires a nuget.org trusted publishing
      # policy for cocosip/obconnector-dotnet / ci-cd.yml.
      - name: NuGet login (OIDC -> temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: virtual # nuget.org profile name (not email); public, so no secret is needed

      - name: Publish packages to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.build-and-test.outputs.version }}
        run: |
          packages=(
            "TestResults/packages/OceanBaseConnector.$VERSION.nupkg"
            "TestResults/packages/OceanBaseConnector.DependencyInjection.$VERSION.nupkg"
          )
          test -s TestResults/packages/RELEASE_NOTES.md
          for package in "${packages[@]}"; do
            test -s "$package"
          done
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Create GitHub Release with version update notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build-and-test.outputs.version }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "OceanBaseConnector $VERSION" \
            --notes-file TestResults/packages/RELEASE_NOTES.md \
            "${flags[@]}" TestResults/packages/*.nupkg TestResults/packages/RELEASE_NOTES.md
