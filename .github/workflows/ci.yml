name: ci-cd

on:
  push:
    branches: [master, main]
    tags: ['*']
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release notes generation
        shell: pwsh
        run: ./eng/Test-ReleaseNotes.ps1

      - name: Validate release tag and generate version update notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./eng/New-ReleaseNotes.ps1 -Tag $env:RELEASE_TAG

      - name: Setup .NET 11 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Verify .NET 10 runtime
        shell: pwsh
        run: |
          if (-not (dotnet --list-runtimes | Select-String 'Microsoft\.NETCore\.App 10\.')) {
            throw '.NET 10 runtime is required to run the net10.0 test targets.'
          }

      - name: Setup package-consumer runtimes (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore OceanBaseConnector.slnx

      # Only the Windows push that packs a release needs every product asset.
      # Other legs compile the runtime used by the unit/DI gates; the forced
      # netstandard2.0 consumer reference still builds the baseline asset.
      - name: Build all package assets
        if: runner.os == 'Windows' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: dotnet build OceanBaseConnector.slnx -c Release --no-restore

      - name: Build CI targets
        if: runner.os != 'Windows' || github.event_name != 'push' || (github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/'))
        run: dotnet build OceanBaseConnector.slnx -c Release --no-restore -p:TargetFramework=net10.0

      - name: Unit tests (.NET 10)
        run: >-
          dotnet test tests/OceanBaseConnector.UnitTests/OceanBaseConnector.UnitTests.csproj
          -c Release --no-restore --no-build

      # ConsumerTests is the compatibility acceptance suite. It runs once on
      # the Windows tag leg after the representative target matrix is reduced
      # to netstandard2.0, netstandard2.1 and net10.0.
      - name: Consumer acceptance tests (tag only)
        if: runner.os == 'Windows' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: >-
          dotnet test tests/OceanBaseConnector.ConsumerTests/OceanBaseConnector.ConsumerTests.csproj
          -c Release --no-restore --no-build

      - name: Dependency injection tests (.NET 10)
        run: >-
          dotnet test tests/OceanBaseConnector.DependencyInjection.Tests/OceanBaseConnector.DependencyInjection.Tests.csproj
          -c Release --no-restore --no-build

      - name: Pack main/master or tag
        if: runner.os == 'Windows' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseNotes = @()
          if ($env:GITHUB_REF.StartsWith('refs/tags/')) {
            $releaseNotes = @("-p:PackageReleaseNotes=https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG")
          }
          foreach ($project in @('OceanBaseConnector', 'OceanBaseConnector.DependencyInjection')) {
            dotnet pack "src/$project/$project.csproj" -c Release --no-build --no-restore -o TestResults/packages @releaseNotes
            if ($LASTEXITCODE -ne 0) { throw "Packing $project failed." }
          }

      - name: Verify actual package consumers (Windows)
        if: runner.os == 'Windows' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        shell: pwsh
        run: ./eng/Verify-Packages.ps1 -PackageDirectory TestResults/packages

      - name: Upload verified packages and release notes
        if: runner.os == 'Windows' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: TestResults/packages/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup .NET 11 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Download verified packages and release notes
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: TestResults/packages

      - name: Publish packages to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY is not configured"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          packages=(
            "TestResults/packages/OceanBaseConnector.$version.nupkg"
            "TestResults/packages/OceanBaseConnector.DependencyInjection.$version.nupkg"
          )
          test -s TestResults/packages/RELEASE_NOTES.md
          for package in "${packages[@]}"; do
            test -s "$package"
          done
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Create GitHub Release with version update notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          flags=()
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "OceanBaseConnector $version" \
            --notes-file TestResults/packages/RELEASE_NOTES.md \
            "${flags[@]}" TestResults/packages/*.nupkg TestResults/packages/RELEASE_NOTES.md
