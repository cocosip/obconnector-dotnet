name: ci-cd

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup package-consumer runtimes (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore OceanBaseConnector.slnx

      - name: Extract and validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::Tag version $expected does not match project version $actual"
            exit 1
          fi
          echo "Validated release version $actual"

      - name: Build
        run: dotnet build OceanBaseConnector.slnx -c Release --no-restore

      - name: Unit tests (.NET 10)
        run: >-
          dotnet test tests/OceanBaseConnector.UnitTests/OceanBaseConnector.UnitTests.csproj
          -c Release --no-restore --no-build

      - name: Consumer tests (.NET 10)
        run: >-
          dotnet test tests/OceanBaseConnector.ConsumerTests/OceanBaseConnector.ConsumerTests.csproj
          -c Release --no-restore --no-build

      - name: Dependency injection tests (.NET 10)
        run: >-
          dotnet test tests/OceanBaseConnector.DependencyInjection.Tests/OceanBaseConnector.DependencyInjection.Tests.csproj
          -c Release --no-restore --no-build

      - name: Integration tests (skip without environment)
        run: >-
          dotnet test tests/OceanBaseConnector.IntegrationTests/OceanBaseConnector.IntegrationTests.csproj
          -c Release --no-restore --no-build

      - name: Pack (master/main artifact)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: dotnet pack OceanBaseConnector.slnx -c Release --no-build --no-restore -o TestResults/packages

      - name: Verify actual package consumers (Windows)
        if: runner.os == 'Windows' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        shell: pwsh
        run: ./eng/Verify-Packages.ps1 -PackageDirectory TestResults/packages


  publish-nuget:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OceanBaseConnector.slnx

      - name: Validate tag version
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::Tag version $expected does not match project version $actual"
            exit 1
          fi

      - name: Pack release tag
        run: dotnet pack OceanBaseConnector.slnx -c Release --no-restore -o TestResults/packages

      - name: Publish packages to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY is not configured"
            exit 1
          fi
          shopt -s nullglob
          packages=(TestResults/packages/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No NuGet packages were created"
            exit 1
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
